name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo run -q -p causa -- demo --out-dir /tmp/causa-fixtures
      - run: cargo run -q -p causa -- test /tmp/causa-fixtures

  node-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bin/causa.js demo
      - run: node --check viewer/app.js
      - run: node --check bin/causa.js
      - run: python3 scripts/check_english.py
